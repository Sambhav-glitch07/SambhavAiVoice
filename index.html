
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08090d" />
  <meta name="description" content="Sambhav AI — your personal real-time AI assistant." />
  <title>Sambhav AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #08090d;
      --panel: rgba(20, 22, 30, .78);
      --line: rgba(255,255,255,.09);
      --muted: #858999;
      --text: #f5f5f8;
      --accent: #b9a5ff;
      --accent2: #8c76ed;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
    }

    body {
      min-height: 100dvh;
      isolation: isolate;
    }

    button, input, select { font: inherit; }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #gl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: -2;
      outline: none;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 45%, transparent 10%, rgba(8,9,13,.12) 55%, #08090d 100%),
        linear-gradient(180deg, rgba(8,9,13,.35), transparent 25%, transparent 70%, rgba(8,9,13,.7));
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 76px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-family: Manrope, sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(185,165,255,.42);
      border-radius: 10px;
      color: var(--accent);
      font-size: 14px;
      box-shadow: 0 0 24px rgba(140,118,237,.13);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-btn {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.035);
      color: #c7c8d2;
      transition: .2s ease;
    }

    .icon-btn:hover {
      background: rgba(185,165,255,.12);
      border-color: rgba(185,165,255,.3);
      color: white;
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .main-content {
      position: absolute;
      inset: 76px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 20px;
    }

    .identity {
      text-align: center;
      margin-top: min(42vh, 310px);
      pointer-events: none;
    }

    .identity h1 {
      margin: 0;
      font-family: Manrope, sans-serif;
      font-size: clamp(27px, 5vw, 42px);
      font-weight: 600;
      letter-spacing: -1.8px;
    }

    .identity p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .2px;
    }

    #status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 25px;
      color: #b7b9c5;
      font-size: 12px;
      letter-spacing: .2px;
    }

    #status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #777b89;
      box-shadow: 0 0 10px currentColor;
    }

    #cap {
      max-width: min(520px, 90vw);
      min-height: 20px;
      margin-top: 13px;
      color: #bfc0cb;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .bottom-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(25px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 17px;
      z-index: 5;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 23px;
      background: rgba(17,18,25,.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 12px 55px rgba(0,0,0,.3);
    }

    .control {
      width: 47px;
      height: 47px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      background: transparent;
      color: #c7c9d4;
      transition: .2s ease;
    }

    .control:hover {
      background: rgba(255,255,255,.07);
      color: white;
    }

    .control svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #mic {
      width: 58px;
      height: 58px;
      border-radius: 19px;
      color: #100e18;
      background: linear-gradient(145deg, #d5c8ff, #a38cf5);
      box-shadow: 0 5px 28px rgba(160,135,255,.28);
    }

    #mic:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 34px rgba(160,135,255,.4);
    }

    #mic svg { stroke: #171323; }

    #end {
      display: none;
      color: #ff8d9b;
    }

    #end.visible { display: grid; }

    .hint {
      color: #686b79;
      font-size: 11px;
      letter-spacing: .2px;
    }

    #transcript {
      position: absolute;
      left: 50%;
      bottom: 120px;
      transform: translateX(-50%);
      width: min(520px, calc(100% - 32px));
      max-height: 28vh;
      overflow-y: auto;
      display: none;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(14,15,21,.82);
      backdrop-filter: blur(22px);
      color: #d1d2dc;
      font-size: 13px;
      line-height: 1.65;
      z-index: 4;
    }

    #transcript.open { display: block; }

    .voice-wrap {
      position: relative;
    }

    #voicePanel {
      position: absolute;
      right: 0;
      bottom: 49px;
      width: 190px;
      padding: 14px;
      display: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(18,19,27,.96);
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 45px rgba(0,0,0,.4);
    }

    #voicePanel.open { display: block; }

    #voicePanel label {
      display: block;
      margin-bottom: 9px;
      color: #a4a6b4;
      font-size: 11px;
    }

    #voice {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: white;
      background: #20212b;
      font-size: 12px;
    }

    #voiceNote {
      display: block;
      margin-top: 8px;
      color: #777b89;
      font-size: 10px;
      line-height: 1.4;
    }

    #auth {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(5,6,10,.82);
      backdrop-filter: blur(20px);
    }

    #auth.open { display: flex; }

    .auth-card {
      width: min(390px, 100%);
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #11121a;
      box-shadow: 0 25px 90px rgba(0,0,0,.5);
    }

    .auth-card h2 {
      margin: 0;
      font-family: Manrope, sans-serif;
      font-size: 25px;
      letter-spacing: -1px;
    }

    .auth-card p {
      margin: 8px 0 23px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .auth-card input {
      width: 100%;
      margin-bottom: 11px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: white;
      background: #1a1b25;
      font-size: 13px;
    }

    .auth-card input:focus {
      border-color: rgba(185,165,255,.55);
    }

    .auth-submit {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      color: #171323;
      background: #c3b1ff;
      font-weight: 700;
    }

    #am {
      margin-top: 13px;
      min-height: 16px;
      color: #ff9ba8;
      font-size: 12px;
    }

    #err {
      position: fixed;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      max-width: calc(100% - 30px);
      padding: 10px 15px;
      border: 1px solid rgba(255,120,140,.25);
      border-radius: 12px;
      background: rgba(40,15,23,.92);
      color: #ffb5c0;
      font-size: 12px;
      display: none;
    }

    #err.show { display: block; }

    #ui { display: contents; }

    @media (max-width: 600px) {
      .topbar { height: 65px; padding: 0 17px; }
      .main-content { inset: 65px 0 0; }
      .identity { margin-top: min(39vh, 270px); }
      .identity p { font-size: 12px; }
      .controls { gap: 7px; padding: 7px 9px; border-radius: 20px; }
      .control { width: 43px; height: 43px; }
      #mic { width: 54px; height: 54px; }
      .bottom-panel { bottom: max(20px, env(safe-area-inset-bottom)); }
      #transcript { bottom: 112px; }
    }
  </style>
</head>

<body>
  <canvas id="gl"></canvas>
  <div class="ambient"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <span>SAMBHAV AI</span>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="tb" title="Show or hide transcript" aria-label="Transcript">
        <svg viewBox="0 0 24 24">
          <path d="M4 5h16v11H8l-4 4V5Z"/>
          <path d="M8 9h8M8 13h5"/>
        </svg>
      </button>

      <button class="icon-btn" id="so" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24">
          <path d="M10 17l5-5-5-5M15 12H3"/>
          <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="err"></div>

  <main class="main-content">
    <div class="identity">
      <h1>Sambhav AI</h1>
      <p>Your personal intelligence, in real time.</p>
      <div id="status">Ready when you are</div>
      <div id="cap"></div>
    </div>
  </main>

  <div id="transcript"></div>

  <section class="bottom-panel">
    <div class="controls">
      <button class="control" id="mute" title="Mute microphone" aria-label="Mute microphone">
        <svg viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>
        </svg>
      </button>

      <button class="control" id="speaker" title="Mute assistant audio" aria-label="Mute assistant audio">
        <svg viewBox="0 0 24 24">
          <path d="M4 10v4h4l5 4V6l-5 4H4Z"/>
          <path d="M17 9a5 5 0 0 1 0 6M19 5a10 10 0 0 1 0 14"/>
        </svg>
      </button>

      <button class="control" id="mic" title="Start conversation" aria-label="Start conversation">
        <svg viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>
        </svg>
      </button>

      <button class="control" id="end" title="End conversation" aria-label="End conversation">
        <svg viewBox="0 0 24 24">
          <path d="M5 15.5c3.8-3 10.2-3 14 0l-2 4c-.3.6-1 .8-1.6.5l-2.1-1.1a1 1 0 0 1-.5-.9v-1.2a10 10 0 0 0-2 0V18a1 1 0 0 1-.5.9l-2.1 1.1c-.6.3-1.3.1-1.6-.5l-2-4Z"/>
        </svg>
      </button>

      <div class="voice-wrap">
        <button class="control" id="voiceToggle" title="Change assistant voice" aria-label="Change voice">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v18M8 7v10M16 7v10M4 10v4M20 10v4"/>
          </svg>
        </button>

        <div id="voicePanel">
          <label for="voice">ASSISTANT VOICE</label>
          <select id="voice">
            <option value="Aoede">Female · Aoede</option>
            <option value="Puck">Male · Puck</option>
          </select>
          <small id="voiceNote">Voice changes apply to the next conversation.</small>
        </div>
      </div>
    </div>

    <div class="hint">Tap the microphone to talk to Sambhav AI</div>
  </section>

  <section id="auth">
    <form class="auth-card" id="af">
      <h2>Welcome back.</h2>
      <p>Sign in to continue your conversations with Sambhav AI.</p>
      <input id="em" type="email" placeholder="Email address" autocomplete="email" required />
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required />
      <button class="auth-submit" id="su" type="submit">Sign in</button>
      <div id="am"></div>
    </form>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
