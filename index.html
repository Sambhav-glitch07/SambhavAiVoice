
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Sambhav AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#08090b;
 --ink:#f3f1ed;
 --dim:#85858e;
 --line:rgba(255,255,255,.11);
 --glass:rgba(255,255,255,.055);
 --accent:#c9b99f;
 --red:#ff626b;
 --green:#a8d5b1;
 --ease:cubic-bezier(.22,1,.36,1);
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--bg);
 color:var(--ink);
 font-family:'Manrope',system-ui,sans-serif;
}

body{
 position:relative;
 isolation:isolate;
}

canvas{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 display:block;
 z-index:0;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 z-index:1;
 pointer-events:none;
 background:
 radial-gradient(ellipse at 50% 48%,rgba(177,160,137,.09),transparent 48%),
 linear-gradient(180deg,rgba(0,0,0,.35),transparent 28%,transparent 70%,rgba(0,0,0,.6));
}

body:after{
 content:"";
 position:fixed;
 inset:0;
 z-index:4;
 pointer-events:none;
 opacity:.12;
 background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
}

button,input{
 font:inherit;
}

button{
 -webkit-appearance:none;
 appearance:none;
}

/* MAIN INTERFACE */

.ui{
 position:relative;
 z-index:2;
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:space-between;
 padding:
 calc(27px + env(safe-area-inset-top,0px))
 24px
 calc(30px + env(safe-area-inset-bottom,0px));
 pointer-events:none;
}

.ui>*{
 pointer-events:auto;
}

/* HEADER */

header{
 position:relative;
 width:100%;
 min-height:40px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.mark{
 font-size:13px;
 font-weight:400;
 letter-spacing:.45em;
 padding-left:.45em;
 color:#f0eee9;
 text-transform:uppercase;
 white-space:nowrap;
}

.mark:before{
 content:"";
 display:inline-block;
 width:5px;
 height:5px;
 border-radius:50%;
 margin:0 11px 2px 0;
 background:var(--accent);
 box-shadow:0 0 12px rgba(201,185,159,.6);
}

.tbtn{
 position:absolute;
 right:0;
 top:50%;
 transform:translateY(-50%);
 display:flex;
 align-items:center;
 gap:9px;
 padding:10px 4px;
 border:0;
 background:none;
 color:var(--dim);
 font-size:10px;
 font-weight:400;
 letter-spacing:.13em;
 text-transform:uppercase;
 cursor:pointer;
 transition:color .3s;
}

.tbtn:hover{
 color:white;
}

.tbtn:focus-visible{
 outline:2px solid var(--accent);
 outline-offset:4px;
}

#so{
 left:0;
 right:auto;
}

#so:not([hidden]){
 animation:fadeIn .5s var(--ease) both;
}

/* TRANSCRIPT STATUS */

#tb:before{
 content:"";
 width:7px;
 height:7px;
 flex-shrink:0;
 border-radius:50%;
 background:var(--green);
 box-shadow:0 0 9px rgba(168,213,177,.6);
 transition:background .3s,box-shadow .3s;
}

#tb[aria-pressed="true"]:before{
 background:var(--green);
 box-shadow:0 0 9px rgba(168,213,177,.7);
 animation:none;
}

#tb[aria-pressed="false"]:before{
 background:var(--red);
 animation:transcriptBlink 1s ease-in-out infinite;
}

@keyframes transcriptBlink{
 0%,100%{
  opacity:1;
  box-shadow:0 0 12px rgba(255,98,107,.8);
 }
 50%{
  opacity:.25;
  box-shadow:0 0 2px rgba(255,98,107,.2);
 }
}

/* CALL STATUS */

#callState{
 position:absolute;
 top:56px;
 left:0;
 display:flex;
 align-items:center;
 gap:8px;
 font-size:9px;
 letter-spacing:.2em;
 color:var(--dim);
 opacity:0;
 transition:opacity .4s;
}

#callState:before{
 content:"";
 width:5px;
 height:5px;
 border-radius:50%;
 background:currentColor;
}

#callState.active{
 opacity:1;
 color:var(--green);
}

#callState.ended{
 opacity:1;
 color:var(--red);
}

/* BOTTOM CONTENT */

.bottom{
 width:100%;
 max-width:580px;
 display:flex;
 flex-direction:column;
 align-items:center;
 text-align:center;
}

#status{
 min-height:36px;
 font-size:clamp(17px,4vw,21px);
 font-weight:300;
 letter-spacing:.035em;
 color:#f1efeb;
 transition:opacity .35s,transform .4s var(--ease);
}

#cap{
 min-height:76px;
 width:100%;
 max-width:430px;
 padding:10px 12px 0;
 font-size:13px;
 line-height:1.9;
 font-weight:300;
 letter-spacing:.015em;
 color:var(--dim);
 transition:opacity .4s,transform .4s;
}

#cap b{
 color:var(--ink);
 font-weight:500;
}

.off #cap{
 opacity:0;
 transform:translateY(8px);
}

/* BUTTON ROW */

.row{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:26px;
 margin-top:12px;
}

button.c{
 position:relative;
 overflow:hidden;
 border:1px solid var(--line);
 background:var(--glass);
 color:var(--ink);
 cursor:pointer;
 border-radius:50%;
 display:grid;
 place-items:center;
 backdrop-filter:blur(18px);
 -webkit-backdrop-filter:blur(18px);
 transition:
 transform .35s var(--ease),
 background .35s,
 border-color .35s,
 box-shadow .35s,
 color .35s;
}

button.c:before{
 content:"";
 position:absolute;
 inset:0;
 border-radius:inherit;
 background:radial-gradient(circle at 50% 25%,rgba(255,255,255,.16),transparent 70%);
 opacity:0;
 transition:opacity .35s;
 pointer-events:none;
}

button.c:hover:before{
 opacity:1;
}

button.c:hover{
 border-color:rgba(255,255,255,.27);
 transform:translateY(-3px);
}

button.c:active{
 transform:scale(.92);
}

button.c:focus-visible{
 outline:2px solid var(--accent);
 outline-offset:5px;
}

button.s{
 width:49px;
 height:49px;
}

/* MAIN WAVEFORM BUTTON */

button.m{
 width:84px;
 height:84px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:
 radial-gradient(circle at 50% 35%,
 rgba(210,198,177,.16),
 rgba(255,255,255,.025) 72%);
 border:1px solid rgba(210,198,177,.35);
 box-shadow:
 inset 0 1px 0 rgba(255,255,255,.17),
 0 0 35px rgba(190,175,150,.09);
}

button.m:hover{
 transform:scale(1.055);
}

button.m:active{
 transform:scale(.94);
}

/* GEMINI LIVE INSPIRED WAVEFORM */

.waveIcon{
 width:36px;
 height:36px;
 stroke:#e8dfd0;
 stroke-width:2.1;
 stroke-linecap:round;
 fill:none;
 overflow:visible;
 position:relative;
 z-index:1;
}

.waveIcon path{
 transform-box:fill-box;
 transform-origin:center;
 animation:waveIdle 1.2s ease-in-out infinite alternate;
}

.waveIcon path:nth-child(2){animation-delay:.12s}
.waveIcon path:nth-child(3){animation-delay:.24s}
.waveIcon path:nth-child(4){animation-delay:.08s}
.waveIcon path:nth-child(5){animation-delay:.3s}
.waveIcon path:nth-child(6){animation-delay:.16s}
.waveIcon path:nth-child(7){animation-delay:.04s}

@keyframes waveIdle{
 from{
  transform:scaleY(.48);
  opacity:.65;
 }
 to{
  transform:scaleY(1);
  opacity:1;
 }
}

button.m.on{
 border-color:rgba(210,198,177,.75);
 box-shadow:
 0 0 0 7px rgba(210,198,177,.055),
 0 0 45px rgba(190,175,150,.2);
}

button.m.on .waveIcon path{
 animation-duration:.48s;
}

/* MICROPHONE MUTE BUTTON */

button.s.on{
 color:#111;
 background:rgba(255,255,255,.88);
}

#mute.muted{
 color:var(--red);
 background:rgba(220,45,55,.12);
 border-color:rgba(255,100,109,.65);
 box-shadow:
 0 0 0 5px rgba(255,60,70,.045),
 0 0 28px rgba(255,50,65,.2);
}

#mute.muted svg{
 stroke:var(--red);
}

svg{
 width:22px;
 height:22px;
 stroke:currentColor;
 fill:none;
 stroke-width:1.6;
 stroke-linecap:round;
 stroke-linejoin:round;
 position:relative;
 z-index:1;
}

/* MIC PULSE */

#mic.on{
 animation:micPulse 2.2s ease-in-out infinite;
}

@keyframes micPulse{
 0%,100%{
  box-shadow:0 0 0 0 rgba(201,185,159,.12);
 }
 50%{
  box-shadow:0 0 0 11px rgba(201,185,159,0);
 }
}

/* WEBGL ERROR */

#err{
 position:fixed;
 inset:0;
 display:none;
 place-items:center;
 text-align:center;
 padding:30px;
 color:var(--dim);
 z-index:5;
 background:var(--bg);
 font-size:14px;
 line-height:1.8;
}

/* AUTHENTICATION */

#auth{
 position:fixed;
 inset:0;
 z-index:6;
 display:none;
 place-items:center;
 padding:24px;
 background:rgba(8,9,11,.87);
 backdrop-filter:blur(25px);
 -webkit-backdrop-filter:blur(25px);
}

#auth.show{
 display:grid;
 animation:authFade .5s var(--ease);
}

#auth form{
 width:min(370px,88vw);
 display:flex;
 flex-direction:column;
 gap:13px;
 text-align:center;
 padding:35px 28px;
 border:1px solid rgba(255,255,255,.10);
 border-radius:23px;
 background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));
 box-shadow:0 25px 100px rgba(0,0,0,.35);
 animation:authUp .7s var(--ease);
}

#auth .mark{
 margin-bottom:20px;
}

#auth input{
 width:100%;
 background:rgba(255,255,255,.045);
 border:1px solid rgba(255,255,255,.11);
 border-radius:13px;
 padding:15px 16px;
 color:var(--ink);
 font-size:14px;
 font-weight:300;
 outline:none;
 transition:border-color .3s,background .3s;
}

#auth input::placeholder{
 color:#777983;
}

#auth input:focus{
 border-color:rgba(201,185,159,.65);
 background:rgba(255,255,255,.07);
}

#auth .go{
 width:100%;
 border:1px solid rgba(201,185,159,.45);
 border-radius:13px;
 padding:15px;
 background:linear-gradient(145deg,rgba(201,185,159,.2),rgba(201,185,159,.07));
 color:#f5f0e8;
 font-size:13px;
 font-weight:500;
 letter-spacing:.1em;
 text-transform:uppercase;
 cursor:pointer;
 transition:transform .3s,background .3s,border-color .3s;
}

#auth .go:hover{
 background:rgba(201,185,159,.25);
 border-color:rgba(201,185,159,.8);
 transform:translateY(-2px);
}

#auth .go:active{
 transform:scale(.97);
}

#auth .alt{
 border:0;
 background:none;
 color:var(--dim);
 font-size:12px;
 letter-spacing:.04em;
 cursor:pointer;
 padding:9px;
 transition:color .3s;
}

#auth .alt:hover{
 color:var(--ink);
}

#am{
 min-height:20px;
 color:var(--dim);
 font-size:12px;
 line-height:1.6;
}

/* ANIMATIONS */

@keyframes authFade{
 from{opacity:0}
 to{opacity:1}
}

@keyframes authUp{
 from{opacity:0;transform:translateY(20px) scale(.98)}
 to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes fadeIn{
 from{opacity:0}
 to{opacity:1}
}

/* RESPONSIVE */

@media(max-width:520px){
 .ui{
  padding-left:20px;
  padding-right:20px;
 }
 .mark{
  font-size:11px;
  letter-spacing:.38em;
 }
 .row{gap:23px}
 button.s{
  width:46px;
  height:46px;
 }
 button.m{
  width:76px;
  height:76px;
 }
 .waveIcon{
  width:33px;
  height:33px;
 }
 #cap{font-size:12px}
}

@media(max-height:600px){
 .ui{
  padding-top:15px;
  padding-bottom:15px;
 }
 .row{margin-top:0}
 #cap{
  min-height:48px;
  padding-top:4px;
 }
 button.m{
  width:66px;
  height:66px;
 }
 button.s{
  width:43px;
  height:43px;
 }
}

@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{
  animation:none!important;
  transition:none!important;
  scroll-behavior:auto!important;
 }
}
</style>
</head>

<body>

<canvas id="gl" aria-hidden="true"></canvas>

<div id="err">
 This device couldn’t start WebGL, which the Sambhav globe needs.
</div>

<div id="auth">
 <form id="af">

  <div class="mark" style="margin-bottom:10px">
   SAMBHAV AI
  </div>

  <input
   id="em"
   type="email"
   placeholder="Email address"
   autocomplete="email"
   required
   aria-label="Email"
  >

  <input
   id="pw"
   type="password"
   placeholder="Password"
   autocomplete="current-password"
   minlength="6"
   required
   aria-label="Password"
  >

  <button class="go" type="submit">
   Sign in
  </button>

  <button class="alt" id="su" type="button">
   Create account
  </button>

  <div id="am" aria-live="polite"></div>

 </form>
</div>

<div class="ui" id="ui">

 <header>

  <button
   class="tbtn"
   id="so"
   style="left:0;right:auto"
   hidden
  >
   Sign out
  </button>

  <div class="mark">SAMBHAV AI</div>

  <button
   class="tbtn"
   id="tb"
   aria-pressed="true"
  >
   Transcript
  </button>

  <div id="callState" aria-live="polite"></div>

 </header>

 <div class="bottom">

  <div id="status" aria-live="polite">
   Tap to talk
  </div>

  <div id="cap" aria-live="polite"></div>

  <div class="row">

   <!-- LEFT: MICROPHONE MUTE -->

   <button
    class="c s"
    id="mute"
    aria-label="Mute microphone"
    aria-pressed="false"
    title="Mute microphone"
   >

    <svg id="muteIcon" viewBox="0 0 24 24">

     <rect x="9" y="3" width="6" height="11" rx="3"/>

     <path d="M5 11a7 7 0 0 0 14 0"/>

     <path d="M12 18v3"/>

    </svg>

   </button>

   <!-- CENTER: LIVE AUDIO WAVEFORM -->

   <button
    class="c m"
    id="mic"
    aria-label="Talk to Sambhav"
    title="Talk to Sambhav"
   >

    <svg class="waveIcon" viewBox="0 0 48 48">

     <path d="M8 21V27"/>

     <path d="M14 16V32"/>

     <path d="M20 10V38"/>

     <path d="M26 15V33"/>

     <path d="M32 8V40"/>

     <path d="M38 17V31"/>

     <path d="M44 21V27"/>

    </svg>

   </button>

   <!-- RIGHT: END CALL -->

   <button
    class="c s"
    id="end"
    aria-label="End call"
    title="End call"
   >

    <svg viewBox="0 0 24 24">

     <path d="M5 15c4-3.5 10-3.5 14 0l-1.8 2.4-3-1.2v-2.4a9 9 0 0 0-4.4 0v2.4l-3 1.2z"/>

    </svg>

   </button>

  </div>

 </div>

</div>

<!-- KEEP YOUR ORIGINAL TECH STACK CONNECTION -->

<script type="module" src="/src/main.js"></script>

</body>
</html>
