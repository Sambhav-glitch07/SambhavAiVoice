<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Sambhav AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#050506;
 --ink:#f5f5f5;
 --dim:#8b8b8f;
 --line:rgba(255,255,255,.14);
 --glass:rgba(255,255,255,.055);
 --accent:#ffffff;
 --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{
 width:100%;height:100%;overflow:hidden;
 background:var(--bg);color:var(--ink);
 font-family:'Manrope',system-ui,sans-serif;
}

body{position:relative;isolation:isolate}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

/* soft vignette */
body:before{
 content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
 background:
 radial-gradient(ellipse at 50% 48%,rgba(255,255,255,.05),transparent 50%),
 linear-gradient(180deg,rgba(0,0,0,.45),transparent 28%,transparent 68%,rgba(0,0,0,.7));
}

/* film grain */
body:after{
 content:"";position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.11;
 background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
}

button,input{font:inherit}
button{-webkit-appearance:none;appearance:none}

/* ================= MOVING GLASS LAYER =================
   Sits over the canvas but is masked away from the globe's centre,
   so the globe itself is never touched. */
.glass{
 position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;
 -webkit-mask-image:radial-gradient(ellipse 36% 42% at 50% 46%,transparent 62%,#000 100%);
         mask-image:radial-gradient(ellipse 36% 42% at 50% 46%,transparent 62%,#000 100%);
}
.glass i{
 position:absolute;display:block;
 border:1px solid rgba(255,255,255,.10);
 background:
 linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.015) 45%,rgba(255,255,255,.06));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -30px 60px rgba(255,255,255,.02);
 will-change:transform;
}
.glass i:nth-child(1){width:46vmax;height:30vmax;left:-14vmax;top:-8vmax;border-radius:34% 66% 58% 42%/46% 38% 62% 54%;animation:drift1 38s ease-in-out infinite alternate}
.glass i:nth-child(2){width:38vmax;height:38vmax;right:-16vmax;top:12vh;border-radius:50%;animation:drift2 46s ease-in-out infinite alternate}
.glass i:nth-child(3){width:52vmax;height:22vmax;left:-10vmax;bottom:-10vmax;border-radius:60% 40% 30% 70%/60% 30% 70% 40%;animation:drift3 42s ease-in-out infinite alternate}
.glass i:nth-child(4){width:24vmax;height:24vmax;right:6vw;bottom:-6vmax;border-radius:42% 58% 70% 30%/45% 45% 55% 55%;animation:drift4 34s ease-in-out infinite alternate}
.glass i:nth-child(5){width:18vmax;height:42vmax;left:6vw;top:34vh;border-radius:999px;opacity:.7;animation:drift2 52s ease-in-out infinite alternate-reverse}

/* diagonal light sweep */
.glass b{
 position:absolute;inset:-30%;
 background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.07) 49%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.07) 51%,transparent 58%);
 mix-blend-mode:screen;
 animation:sweep 15s linear infinite;
 will-change:transform;
}

@keyframes drift1{from{transform:translate3d(0,0,0) rotate(-6deg)}to{transform:translate3d(9vw,7vh,0) rotate(14deg)}}
@keyframes drift2{from{transform:translate3d(0,0,0) rotate(0) scale(1)}to{transform:translate3d(-8vw,-9vh,0) rotate(-20deg) scale(1.12)}}
@keyframes drift3{from{transform:translate3d(0,0,0) rotate(4deg)}to{transform:translate3d(10vw,-6vh,0) rotate(-12deg)}}
@keyframes drift4{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(-9vw,-8vh,0) rotate(24deg) scale(1.15)}}
@keyframes sweep{from{transform:translateX(-45%)}to{transform:translateX(45%)}}

/* ================= MAIN INTERFACE ================= */

.ui{
 position:relative;z-index:2;width:100%;height:100%;
 display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 padding:calc(27px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px));
 pointer-events:none;
}
.ui>*{pointer-events:auto}

header{position:relative;width:100%;min-height:40px;display:flex;align-items:center;justify-content:center}

.mark{
 font-size:13px;font-weight:300;letter-spacing:.5em;padding-left:.5em;
 color:#fff;text-transform:uppercase;white-space:nowrap;
 text-shadow:0 0 24px rgba(255,255,255,.35);
}
.mark:before{
 content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
 margin:0 11px 2px 0;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.7);
}

.tbtn{
 position:absolute;right:0;top:50%;transform:translateY(-50%);
 display:flex;align-items:center;gap:9px;padding:10px 4px;
 border:0;background:none;color:var(--dim);
 font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;
 cursor:pointer;transition:color .3s;
}
.tbtn:hover{color:#fff}
.tbtn:focus-visible{outline:2px solid #fff;outline-offset:4px}

#so{left:0;right:auto}
#so:not([hidden]){animation:fadeIn .5s var(--ease) both}

/* transcript indicator: solid = on, hollow blinking ring = off */
#tb:before{
 content:"";width:7px;height:7px;flex-shrink:0;border-radius:50%;
 background:#fff;box-shadow:0 0 9px rgba(255,255,255,.7);
 transition:background .3s,box-shadow .3s;
}
#tb[aria-pressed="true"]:before{background:#fff;box-shadow:0 0 9px rgba(255,255,255,.7);animation:none}
#tb[aria-pressed="false"]:before{
 background:transparent;border:1px solid rgba(255,255,255,.7);box-shadow:none;
 animation:transcriptBlink 1.2s ease-in-out infinite;
}
#tb:after{margin-left:-2px;opacity:.9}
#tb[aria-pressed="true"]:after{content:"On";color:#fff}
#tb[aria-pressed="false"]:after{content:"Off";color:var(--dim)}
#tb[aria-pressed="false"]{color:#5c5c61}
@keyframes transcriptBlink{0%,100%{opacity:1}50%{opacity:.25}}

/* call status */
#callState{
 position:absolute;top:56px;left:0;display:flex;align-items:center;gap:8px;
 font-size:9px;letter-spacing:.2em;color:var(--dim);opacity:0;transition:opacity .4s;
}
#callState:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
#callState.active{opacity:1;color:#fff}
#callState.ended{opacity:1;color:var(--dim)}

/* bottom */
.bottom{width:100%;max-width:580px;display:flex;flex-direction:column;align-items:center;text-align:center}

#status{
 min-height:36px;font-size:clamp(17px,4vw,21px);font-weight:200;letter-spacing:.06em;
 color:#fff;text-shadow:0 0 28px rgba(255,255,255,.28);
 transition:opacity .35s,transform .4s var(--ease);
}

#cap{
 min-height:76px;width:100%;max-width:430px;padding:10px 12px 0;
 font-size:13px;line-height:1.9;font-weight:300;letter-spacing:.015em;color:var(--dim);
 transition:opacity .4s,transform .4s;
}
#cap b{color:#fff;font-weight:500}
.off #cap{opacity:0;transform:translateY(8px)}

.row{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:12px}

/* ================= GLASS BUTTONS ================= */

button.c{
 position:relative;overflow:hidden;
 border:1px solid var(--line);
 background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
 color:#fff;cursor:pointer;border-radius:50%;display:grid;place-items:center;
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 30px rgba(0,0,0,.35);
 transition:transform .35s var(--ease),background .35s,border-color .35s,box-shadow .35s,color .35s;
}
/* hover highlight */
button.c:before{
 content:"";position:absolute;inset:0;border-radius:inherit;
 background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.28),transparent 70%);
 opacity:0;transition:opacity .35s;pointer-events:none;
}
/* moving glass sheen */
button.c:after{
 content:"";position:absolute;top:-50%;bottom:-50%;left:-60%;width:60%;pointer-events:none;
 background:linear-gradient(105deg,transparent,rgba(255,255,255,.26),transparent);
 transform:translateX(-120%) skewX(-18deg);
 animation:sheen 7s ease-in-out infinite;
}
#mute:after{animation-delay:1.2s}
#end:after{animation-delay:2.6s}
@keyframes sheen{0%,55%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(420%) skewX(-18deg)}}

button.c:hover:before{opacity:1}
button.c:hover{border-color:rgba(255,255,255,.4);transform:translateY(-3px)}
button.c:active{transform:scale(.92)}
button.c:focus-visible{outline:2px solid #fff;outline-offset:5px}

button.s{width:49px;height:49px}

button.m{
 width:84px;height:84px;border-radius:50%;
 background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.26),rgba(255,255,255,.04) 72%);
 border:1px solid rgba(255,255,255,.4);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 40px rgba(255,255,255,.1);
}
button.m:hover{transform:scale(1.055)}
button.m:active{transform:scale(.94)}

/* waveform icon */
.waveIcon{
 width:36px;height:36px;stroke:#fff;stroke-width:2.1;stroke-linecap:round;
 fill:none;overflow:visible;position:relative;z-index:1;
}
.waveIcon path{transform-box:fill-box;transform-origin:center;animation:waveIdle 1.2s ease-in-out infinite alternate}
.waveIcon path:nth-child(2){animation-delay:.12s}
.waveIcon path:nth-child(3){animation-delay:.24s}
.waveIcon path:nth-child(4){animation-delay:.08s}
.waveIcon path:nth-child(5){animation-delay:.3s}
.waveIcon path:nth-child(6){animation-delay:.16s}
.waveIcon path:nth-child(7){animation-delay:.04s}
@keyframes waveIdle{from{transform:scaleY(.48);opacity:.65}to{transform:scaleY(1);opacity:1}}

button.m.on{
 border-color:rgba(255,255,255,.85);
 box-shadow:0 0 0 7px rgba(255,255,255,.06),0 0 55px rgba(255,255,255,.22);
}
button.m.on .waveIcon path{animation-duration:.48s}

/* mute: red crossed-out mic when active */
#mute .slash{opacity:0;stroke-dasharray:24;stroke-dashoffset:24;transition:opacity .25s,stroke-dashoffset .35s var(--ease)}
#mute.muted,#mute.on,#mute[aria-pressed="true"]{
 color:#ff4d57;background:linear-gradient(150deg,rgba(255,77,87,.22),rgba(255,77,87,.06));
 border-color:rgba(255,77,87,.75);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 5px rgba(255,77,87,.07),0 0 30px rgba(255,77,87,.3);
}
#mute.muted svg,#mute.on svg,#mute[aria-pressed="true"] svg{stroke:#ff4d57}
#mute.muted .slash,#mute.on .slash,#mute[aria-pressed="true"] .slash{opacity:1;stroke-dashoffset:0}

svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}

#mic.on{animation:micPulse 2.2s ease-in-out infinite}
@keyframes micPulse{
 0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.16),0 0 55px rgba(255,255,255,.2)}
 50%{box-shadow:0 0 0 12px rgba(255,255,255,0),0 0 55px rgba(255,255,255,.2)}
}

/* WebGL error */
#err{
 position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;
 color:var(--dim);z-index:5;background:var(--bg);font-size:14px;line-height:1.8;
}

/* ================= AUTH ================= */

#auth{
 position:fixed;inset:0;z-index:6;display:none;place-items:center;padding:24px;
 background:rgba(5,5,6,.82);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
}
#auth.show{display:grid;animation:authFade .5s var(--ease)}

#auth form{
 position:relative;overflow:hidden;
 width:min(370px,88vw);display:flex;flex-direction:column;gap:13px;text-align:center;
 padding:35px 28px;border:1px solid rgba(255,255,255,.14);border-radius:23px;
 background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.02));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 25px 100px rgba(0,0,0,.5);
 animation:authUp .7s var(--ease);
}
#auth form:before{
 content:"";position:absolute;top:-50%;bottom:-50%;left:-70%;width:60%;pointer-events:none;
 background:linear-gradient(105deg,transparent,rgba(255,255,255,.1),transparent);
 transform:translateX(-120%) skewX(-18deg);animation:sheen 9s ease-in-out infinite;
}
#auth form>*{position:relative}
#auth .mark{margin-bottom:20px}

#auth input{
 width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
 border-radius:13px;padding:15px 16px;color:#fff;font-size:14px;font-weight:300;outline:none;
 transition:border-color .3s,background .3s;
}
#auth input::placeholder{color:#76767b}
#auth input:focus{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.09)}

#auth .go{
 width:100%;border:1px solid rgba(255,255,255,.5);border-radius:13px;padding:15px;
 background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.78));
 color:#0a0a0a;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
 cursor:pointer;transition:transform .3s,box-shadow .3s;
}
#auth .go:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,255,255,.2)}
#auth .go:active{transform:scale(.97)}
#auth .go:focus-visible,#auth .alt:focus-visible{outline:2px solid #fff;outline-offset:3px}

#auth .alt{border:0;background:none;color:var(--dim);font-size:12px;letter-spacing:.04em;cursor:pointer;padding:9px;transition:color .3s}
#auth .alt:hover{color:#fff}

#am{min-height:20px;color:var(--dim);font-size:12px;line-height:1.6}

@keyframes authFade{from{opacity:0}to{opacity:1}}
@keyframes authUp{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ================= RESPONSIVE ================= */

@media(max-width:520px){
 .ui{padding-left:20px;padding-right:20px}
 .mark{font-size:11px;letter-spacing:.38em}
 .row{gap:23px}
 button.s{width:46px;height:46px}
 button.m{width:76px;height:76px}
 .waveIcon{width:33px;height:33px}
 #cap{font-size:12px}
 .glass i:nth-child(5){display:none}
}

@media(max-height:600px){
 .ui{padding-top:15px;padding-bottom:15px}
 .row{margin-top:0}
 #cap{min-height:48px;padding-top:4px}
 button.m{width:66px;height:66px}
 button.s{width:43px;height:43px}
}

@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<body>

<canvas id="gl" aria-hidden="true"></canvas>

<!-- moving glass layer (decorative) -->
<div class="glass" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b></div>

<div id="err">
 This device couldn’t start WebGL, which the Sambhav globe needs.
</div>

<div id="auth">
 <form id="af">

  <div class="mark" style="margin-bottom:10px">
   SAMBHAV AI
  </div>

  <input
   id="em"
   type="email"
   placeholder="Email address"
   autocomplete="email"
   required
   aria-label="Email"
  >

  <input
   id="pw"
   type="password"
   placeholder="Password"
   autocomplete="current-password"
   minlength="6"
   required
   aria-label="Password"
  >

  <button class="go" type="submit">
   Sign in
  </button>

  <button class="alt" id="su" type="button">
   Create account
  </button>

  <div id="am" aria-live="polite"></div>

 </form>
</div>

<div class="ui" id="ui">

 <header>

  <button
   class="tbtn"
   id="so"
   style="left:0;right:auto"
   hidden
  >
   Sign out
  </button>

  <div class="mark">SAMBHAV AI</div>

  <button
   class="tbtn"
   id="tb"
   aria-pressed="true"
  >
   Transcript
  </button>

  <div id="callState" aria-live="polite"></div>

 </header>

 <div class="bottom">

  <div id="status" aria-live="polite">
   Tap to talk
  </div>

  <div id="cap" aria-live="polite"></div>

  <div class="row">

   <!-- LEFT: MICROPHONE MUTE -->

   <button
    class="c s"
    id="mute"
    aria-label="Mute microphone"
    aria-pressed="false"
    title="Mute microphone"
   >

    <svg id="muteIcon" viewBox="0 0 24 24">

     <rect x="9" y="3" width="6" height="11" rx="3"/>

     <path d="M5 11a7 7 0 0 0 14 0"/>

     <path d="M12 18v3"/>

     <path class="slash" d="M4 4L20 20"/>

    </svg>

   </button>

   <!-- CENTER: LIVE AUDIO WAVEFORM -->

   <button
    class="c m"
    id="mic"
    aria-label="Talk to Sambhav"
    title="Talk to Sambhav"
   >

    <svg class="waveIcon" viewBox="0 0 48 48">

     <path d="M8 21V27"/>

     <path d="M14 16V32"/>

     <path d="M20 10V38"/>

     <path d="M26 15V33"/>

     <path d="M32 8V40"/>

     <path d="M38 17V31"/>

     <path d="M44 21V27"/>

    </svg>

   </button>

   <!-- RIGHT: END CALL -->

   <button
    class="c s"
    id="end"
    aria-label="End call"
    title="End call"
   >

    <svg viewBox="0 0 24 24">

     <path d="M5 15c4-3.5 10-3.5 14 0l-1.8 2.4-3-1.2v-2.4a9 9 0 0 0-4.4 0v2.4l-3 1.2z"/>

    </svg>

   </button>

  </div>

 </div>

</div>

<!-- KEEP YOUR ORIGINAL TECH STACK CONNECTION -->

<script type="module" src="/src/main.js"></script>

</body>
</html>
